name: Deploy to one.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy full repository to one.com via rsync
        env:
          SSH_HOST: ${{ secrets.ONECOM_HOST }}
          SSH_USER: ${{ secrets.ONECOM_USERNAME }}
          SSH_PASSWORD: ${{ secrets.ONECOM_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "test -d /run/webroots/d96d96f4 || { echo 'Remote /run/webroots/d96d96f4 does not exist'; exit 1; }"

          sshpass -p "$SSH_PASSWORD" rsync -az --delete \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$SSH_USER@$SSH_HOST:/run/webroots/d96d96f4"
